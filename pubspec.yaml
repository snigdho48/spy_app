name: spy_love
description: Consent-based device monitoring platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # State management & routing
  provider: ^6.1.5

  # Networking — latest pub.dev is 3.1.0 (re-exports dio / EasyLoading / dart_either / connectivity; do not add those)
  one_request: ^3.1.0
  # Direct import for IOHttpClientAdapter (certificate pinning).
  dio: ^5.11.0

  # Firebase
  firebase_core: ^4.14.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^11.0.0
  crypto: ^3.0.6

  # Utils
  uuid: ^4.6.0
  intl: ^0.20.3
  permission_handler: ^13.0.2
  google_sign_in: ^7.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  call_log: ^6.0.1
  geolocator: ^14.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  google_fonts: ^8.2.1
  share_plus: ^13.3.1
  firebase_messaging: ^16.7.1
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
