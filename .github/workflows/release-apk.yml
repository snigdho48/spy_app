name: Release APK

# Push a tag such as v1.0.0, or run this workflow by hand.
# Required repo secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
# See docs/RELEASE_APK.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v1.0.0). Empty uses v<pubspec version>."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release-apk:
    name: Build and publish APKs
    runs-on: ubuntu-latest
    env:
      # Required repository variables (Settings → Secrets and variables → Actions
      # → Variables). No host is committed here — unset values mean the build
      # uses whatever default is compiled into app_config.dart via
      # String.fromEnvironment, and --dart-define is omitted for empty vars.
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      WS_BASE_URL: ${{ vars.WS_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # pubspec.yaml requires Dart >= 3.12.1. 3.47.8 ships Dart 3.13.7.
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Resolve release version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            TAG="$INPUT_TAG"
            [[ "$TAG" == v* ]] || TAG="v${TAG}"
          else
            RAW="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
            TAG="v${RAW%%+*}"
          fi
          VERSION="${TAG#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$TAG" ]]; then
            echo "Could not derive a version from tag '${TAG}'."
            exit 1
          fi
          # Build number (versionCode) is the +N suffix in pubspec. It drives
          # the in-app updater's "is this newer" check and must increase per
          # release even when the semantic version is unchanged.
          PUBSPEC_VERSION="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          BUILD="${PUBSPEC_VERSION##*+}"
          if [[ -z "$BUILD" || "$BUILD" == "$PUBSPEC_VERSION" ]]; then
            BUILD="1"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG} (version ${VERSION}, build ${BUILD})"

      - name: Install Android SDK pieces this project compiles against
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          mkdir -p "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [[ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]]; then
            TMP="$(mktemp -d)"
            curl -fsSL -o "$TMP/cmdtools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q "$TMP/cmdtools.zip" -d "$TMP"
            mkdir -p "$SDK/cmdline-tools/latest"
            mv "$TMP/cmdline-tools/"* "$SDK/cmdline-tools/latest/"
            rm -rf "$TMP"
          fi
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          # `yes` exits 141 (SIGPIPE) once sdkmanager closes stdin. Don't fail the step on that.
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          # compileSdk 37 with compileSdkMinor 0 resolves platforms/android-37.0
          # (the published package). There is no platforms/android-37 directory.
          # NDK matches Flutter 3.47.8's flutter.ndkVersion.
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-37.0" \
            "platforms;android-36" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;37.0.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
          flutter config --android-sdk "$SDK"

      - name: Write release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_BASE64}" ]] || missing+=("KEYSTORE_BASE64")
          [[ -n "${KEYSTORE_PASSWORD}" ]] || missing+=("KEYSTORE_PASSWORD")
          [[ -n "${KEY_ALIAS}" ]] || missing+=("KEY_ALIAS")
          [[ -n "${KEY_PASSWORD}" ]] || missing+=("KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "Missing GitHub Actions secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions. See docs/RELEASE_APK.md."
            exit 1
          fi
          python3 - << 'PY'
          import base64
          import os
          from pathlib import Path

          raw = "".join(os.environ["KEYSTORE_BASE64"].split())
          keystore = base64.b64decode(raw)
          if not keystore:
              raise SystemExit("KEYSTORE_BASE64 decoded to an empty file.")
          path = Path("android/keystore/release.jks")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(keystore)
          # First '=' separates the key from the value. Passwords must not contain newlines.
          Path("android/key.properties").write_text(
              "storeFile=keystore/release.jks\n"
              f"storePassword={os.environ['KEYSTORE_PASSWORD']}\n"
              f"keyAlias={os.environ['KEY_ALIAS']}\n"
              f"keyPassword={os.environ['KEY_PASSWORD']}\n",
              encoding="utf-8",
          )
          print(f"Wrote {path} ({len(keystore)} bytes) and android/key.properties.")
          PY

      - name: Download Dart packages
        run: flutter pub get

      - name: Require API host repository variables
        run: |
          set -euo pipefail
          # Do not print variable values (may contain hosts). Empty means the
          # APK will use the compiled String.fromEnvironment default only —
          # still warn so releases are intentional.
          missing=()
          [[ -n "${API_BASE_URL}" ]] || missing+=("API_BASE_URL")
          [[ -n "${WS_BASE_URL}" ]] || missing+=("WS_BASE_URL")
          if (( ${#missing[@]} > 0 )); then
            echo "Missing GitHub Actions repository variables: ${missing[*]}"
            echo "Set them under Settings → Secrets and variables → Actions → Variables."
            echo "See docs/RELEASE_APK.md. Refusing to bake an implicit host from the workflow."
            exit 1
          fi
          # Reject obvious tunnel leftovers without printing the value.
          reject_tunnel() {
            local name="$1"
            local value="$2"
            local lower
            lower="$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in
              *ngrok*|*loca.lt*|*trycloudflare*|*serveo*)
                echo "${name} looks like a tunnel host. Set the production repository variable."
                exit 1
                ;;
            esac
          }
          reject_tunnel API_BASE_URL "$API_BASE_URL"
          reject_tunnel WS_BASE_URL "$WS_BASE_URL"

      - name: Build split-per-ABI release APKs
        run: |
          set -euo pipefail
          # Project has no abiFilters. Flutter's release APK targets are
          # android-arm, android-arm64, and android-x64 (not 32-bit x86).
          defines=()
          if [[ -n "${API_BASE_URL}" ]]; then
            defines+=(--dart-define=API_BASE_URL="$API_BASE_URL")
          fi
          if [[ -n "${WS_BASE_URL}" ]]; then
            defines+=(--dart-define=WS_BASE_URL="$WS_BASE_URL")
          fi
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64 \
            "${defines[@]}"
          SRC="build/app/outputs/flutter-apk"
          mkdir -p release-apks
          # Version-less, stable asset names so the releases/latest/download and
          # releases/download/latest URLs never change between builds.
          cp "$SRC/app-arm64-v8a-release.apk" "release-apks/SpyLove-arm64-v8a.apk"
          cp "$SRC/app-armeabi-v7a-release.apk" "release-apks/SpyLove-armeabi-v7a.apk"
          cp "$SRC/app-x86_64-release.apk" "release-apks/SpyLove-x86_64.apk"

      - name: Build universal release APK
        run: |
          set -euo pipefail
          defines=()
          if [[ -n "${API_BASE_URL}" ]]; then
            defines+=(--dart-define=API_BASE_URL="$API_BASE_URL")
          fi
          if [[ -n "${WS_BASE_URL}" ]]; then
            defines+=(--dart-define=WS_BASE_URL="$WS_BASE_URL")
          fi
          flutter build apk --release \
            --target-platform android-arm,android-arm64,android-x64 \
            "${defines[@]}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release-apks/SpyLove-universal.apk"
          # latest.json drives the in-app updater. It carries no API host —
          # only version, build number, and short notes.
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build }}"
          VERSION="$VERSION" BUILD="$BUILD" python3 -c "import json,pathlib,os; pathlib.Path('release-apks/latest.json').write_text(json.dumps({'version':os.environ['VERSION'],'build':int(os.environ['BUILD']),'notes':'Login fix and stability improvements. Install to update.'}))"
          echo "APKs:"
          ls -lh release-apks
          test -s "release-apks/SpyLove-arm64-v8a.apk"
          test -s "release-apks/SpyLove-armeabi-v7a.apk"
          test -s "release-apks/SpyLove-x86_64.apk"
          test -s "release-apks/SpyLove-universal.apk"
          test -s "release-apks/latest.json"

      # Fixed title and description. generate_release_notes appends the
      # commit list after the "Changes since last release" heading.
      - name: Write GitHub Release description
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Escaped backticks stay literal in this unquoted heredoc.
          cat > release-notes.md << EOF
          Spy Love ${VERSION} is a consent-based monitoring app. The person being monitored can see that monitoring is on and can pause sharing.

          ## What's included

          - Signed release APKs for 64-bit ARM, 32-bit ARM, 64-bit x86, and a universal package
          - Consent Horizon screens for pairing, home, devices, activity, location, and account
          - Pairing that the other phone must accept before monitoring starts
          - Location, safe zones, and activity limited to the consent scopes that were accepted

          ## Which APK to install

          Most phones should use the arm64 build. Use the universal APK only when the CPU is unknown.

          | File | Device |
          | --- | --- |
          | \`SpyLove-arm64-v8a.apk\` | Current phones (64-bit ARM) |
          | \`SpyLove-armeabi-v7a.apk\` | Older 32-bit ARM phones |
          | \`SpyLove-x86_64.apk\` | 64-bit x86 phones and emulators |
          | \`SpyLove-universal.apk\` | All three ABIs in one larger file |

          Asset names stay the same across builds, so these links always fetch the newest APK:

          - \`.../releases/latest/download/SpyLove-arm64-v8a.apk\`
          - \`.../releases/download/latest/SpyLove-arm64-v8a.apk\`

          ## Install

          1. Download one APK from the assets on this release.
          2. Open it on the Android device. If the system blocks the install, allow this source to install unknown apps, then open the file again.
          3. Confirm the install. The app id is \`org.hmg.spy_love\`.
          4. Open Spy Love and sign in. Monitoring of another phone starts only after that person accepts the pairing request on their device.

          ## Notes

          - **Android:** 7.0 or newer (API 24, \`minSdk\` 24).
          - **Firebase:** initialized from the Firebase Android config shipped in this build, including Google Sign-In.

          ## Changes since last release

          Commits and pull requests since the previous tag are listed below.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Spy Love ${{ steps.version.outputs.version }} — Consent Horizon"
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-apks/*.apk
            release-apks/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish moving "latest" release
        uses: softprops/action-gh-release@v2
        with:
          # Moving tag + release so download links can also use the literal
          # `latest` tag. action-gh-release points the tag at this run's commit.
          tag_name: latest
          name: "Spy Love — Latest"
          body: "Always-current build. Mirrors the newest versioned release. Stable asset names mean download links never change."
          prerelease: false
          make_latest: "true"
          fail_on_unmatched_files: true
          files: |
            release-apks/*.apk
            release-apks/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
